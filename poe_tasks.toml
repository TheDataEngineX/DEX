[tool.poe.tasks]
version = "python -c \"from importlib.metadata import version; print(version('dataenginex'))\""

lint = "ruff check src/ tests/"
lint-fix = "ruff check --fix src/ tests/"
format = "ruff format src/ tests/"
typecheck = "mypy --strict src/dataenginex/"
test = "pytest tests/ -x -q"
test-cov = "pytest tests/ -x -q --cov=dataenginex --cov-report=term-missing"
check-all = { shell = "ruff check src/ tests/ && mypy --strict src/dataenginex/ && pytest tests/ -x -q" }
security = "pip-audit"
clean = "rm -rf .mypy_cache .ruff_cache .pytest_cache htmlcov coverage.xml .coverage"
