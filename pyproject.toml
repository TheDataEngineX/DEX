[project]
name = "dataenginex"
version = "0.7.0"
description = "DEX Platform — open-source, local-first Data + ML + AI platform with Spark 4.2 foundation"
authors = [{ name = "TheDataEngineX" }]
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
keywords = ["data-engineering", "ml", "ai", "spark", "dex", "open-source", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "click>=8.4.2",
    "duckdb>=1.5.4",
    "croniter>=6.2.4",
    "httpx>=0.28.1",
    "prometheus-client>=0.25.0",
    "structlog>=26.1.0",
    "pyarrow>=24.0.0",
    "orjson>=3.11.9",
    "confluent-kafka>=2.15.0",
    "pika>=1.4.1",
    "strawberry-graphql[fastapi]>=0.322.2",
    "sqlalchemy>=2.0.51",
    "elasticsearch>=9.4.1",
]

[project.scripts]
dex = "dataenginex.cli.main:dex"

[project.optional-dependencies]
cloud = [
    "boto3>=1.43.52",
    "google-cloud-storage>=3.13.0",
    "google-cloud-bigquery>=3.42.2",
]
delta = ["deltalake>=1.6.2"]
qdrant = ["qdrant-client>=1.18.0"]
pytorch = ["torch>=2.13.0"]

[project.urls]
Homepage = "https://github.com/TheDataEngineX/dataenginex"
Repository = "https://github.com/TheDataEngineX/dataenginex"
Issues = "https://github.com/TheDataEngineX/dataenginex/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.22",
    "mypy>=2.3.0",
    "types-pyyaml>=6.0.12.20260408",
    "types-requests>=2.33.0.20260712",
    "poethepoet>=0.48.0",
    "uv>=0.11.30",
    "pre-commit>=4.6.0",
    "pip-audit>=2.10.0",
]
spark = ["pyspark>=4.2.0", "delta-spark>=4.0.0", "pyiceberg>=0.11.0"]
notebook = ["pandas>=2.0.0"]
ml = ["scikit-learn>=1.9.0", "sentence-transformers>=5.6.0"]
tracking = ["mlflow>=3.14.0", "pandas>=2.0.0,<4"]
catalog = ["pyhive[hive]>=0.7.0", "thrift-sasl>=0.4.0"]
lineage = ["openlineage-python>=1.30.0"]

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataenginex"]

# --- shared tool configuration ---

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.isort]
known-first-party = ["dataenginex"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["misc"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "croniter.*",
    "structlog.*",
    "prometheus_client.*",
    "qdrant_client.*",
    "boto3.*",
    "google.auth.*",
    "google.cloud.*",
    "google.api_core.*",
    "pyarrow.*",
    "mlflow.*",
    "sentence_transformers.*",
    "litellm.*",
    "pyspark.*",
    "torch.*",
    "deltalake.*",
    "keyring.*",
    "strawberry.*",
    "pika.*",
    "confluent_kafka.*",
    "elasticsearch.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:websockets\\.legacy",
    "ignore::DeprecationWarning:uvicorn\\.protocols",
    "ignore:unclosed.*socket:ResourceWarning",
    "ignore:unclosed event loop:ResourceWarning",
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["dataenginex"]
parallel = true
omit = [
    "*/spark/ml/mllib_provider.py",
    "*/spark/transforms/applier.py",
    "*/spark/sql/spark_sql_executor.py",
    "*/spark/connect/client.py",
    "*/spark/streaming/query_manager.py",
    "*/spark/datasource/registry.py",
    "*/spark/catalog/adapter.py",
    "*/spark/catalog/iceberg.py",
    "*/domains/data/pipeline/runner.py",
    "*/domains/ml/training.py",
    "*/domains/ai/tools/builtin.py",
    "*/api/graphql.py",
    "*/cli/train.py",
    "*/cli/studio.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
